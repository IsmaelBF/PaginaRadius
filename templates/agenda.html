<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Agenda Diaria</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24">
    <div class="max-w-md mx-auto px-4 pt-6 space-y-6">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400">Agenda de Hoy</h1>
                <p class="text-xs text-slate-400">{{ fecha_hoy }}</p>
            </div>
            <span class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full">@ismael</span>
        </header>

        <!-- Lista de actividades del día -->
        <section class="space-y-3">
            {% if actividades %}
                {% for act in actividades %}
                    <a href="/actividad/{{ act.id }}" 
                       class="block bg-slate-900 border border-slate-800 hover:border-indigo-500/50 rounded-2xl p-4 transition">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <span class="text-sm font-mono font-bold text-indigo-400 bg-slate-950 px-2.5 py-1 rounded-lg">
                                    {{ act.hora_inicio }}
                                </span>
                                <div>
                                    <h2 class="font-semibold text-base {{ 'line-through text-slate-500' if act.completada else 'text-slate-100' }}">
                                        {{ act.titulo }}
                                    </h2>
                                    <span class="text-xs uppercase tracking-wider {{ 'text-emerald-400' if act.tipo == 'gimnasio' else 'text-slate-400' }}">
                                        {{ act.tipo }}
                                    </span>
                                </div>
                            </div>
                            <span class="text-slate-500 text-lg">›</span>
                        </div>
                    </a>
                {% endfor %}
            {% else %}
                <div class="bg-slate-900/50 border border-dashed border-slate-800 rounded-2xl p-6 text-center">
                    <p class="text-sm text-slate-400">No tienes actividades programadas para hoy.</p>
                </div>
            {% endif %}
        </section>

        <!-- Formulario rápido para agregar actividad -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
            <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">+ Nueva Actividad</h3>
            <form action="/agregar-actividad" method="POST" class="space-y-3">
                <div class="grid grid-cols-3 gap-2">
                    <input type="time" name="hora_inicio" required
                           class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                    <select name="tipo"
                            class="col-span-2 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="general">Actividad General</option>
                        <option value="tarea">Tarea / Universidad</option>
                        <option value="gimnasio">Entrenamiento Gimnasio</option>
                    </select>
                </div>
                <input type="text" name="titulo" placeholder="Ej: Entrenar Pecho o Entrega de Redes" required
                       class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                <textarea name="descripcion" rows="2" placeholder="Detalles, notas o ejercicios a realizar..."
                          class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"></textarea>
                <button type="submit"
                        class="w-full bg-indigo-500 hover:bg-indigo-400 text-white font-bold py-3 rounded-xl transition text-sm">
                    Agregar a la Agenda
                </button>
            </form>
        </section>
    </div>

    <!-- Barra de navegación inferior móvil -->
    <nav class="fixed bottom-0 inset-x-0 bg-slate-900 border-t border-slate-800 flex justify-around py-3 max-w-md mx-auto">
        <a href="/" class="text-indigo-400 font-bold text-xs flex flex-col items-center">Agenda</a>
        <a href="/gimnasio" class="text-slate-400 hover:text-emerald-400 font-medium text-xs flex flex-col items-center">Gimnasio</a>
        <a href="/sueno" class="text-slate-400 hover:text-sky-400 font-medium text-xs flex flex-col items-center">Sueño</a>
    </nav>
</body>
</html>
